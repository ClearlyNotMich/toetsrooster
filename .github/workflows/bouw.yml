name: Bouw programma's

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bouw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefact: OWB-Toetsrooster-Windows
            bestand: dist/OWB-Toetsrooster.exe
          # Oudere Ubuntu-basis = werkt op meer Linux-distributies (glibc).
          - os: ubuntu-22.04
            artefact: OWB-Toetsrooster-Linux
            bestand: dist/OWB-Toetsrooster
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Qt-systeembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Afhankelijkheden
        run: |
          python -m pip install -r requirements.txt pyinstaller pytest
          npm ci
      - name: Tests
        run: python -m pytest -q tests
      - name: Bouwen
        run: pyinstaller --noconfirm roosterapp.spec
      - name: Zelftest van het gebouwde programma
        shell: bash
        run: |
          mkdir zelftest
          cp "voorbeeld/Voorbeeld rooster.xlsx" zelftest/
          ./${{ matrix.bestand }} --controle "zelftest/Voorbeeld rooster.xlsx" zelftest
          ls zelftest/controle-Rooster_Kans1.xlsx zelftest/controle-Rooster_Her.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: ${{ matrix.bestand }}
          if-no-files-found: error
